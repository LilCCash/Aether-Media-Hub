name: Aether
options:
  bundleIdPrefix: app.aether
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "26.0"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  AetherCore:
    path: Packages/AetherCore
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
  # libmpv + FFmpeg for iOS (LGPL-3.0 product "MPVKit", not the GPL one). Pinned to the stable release; see docs/03-LICENSES.md.
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Aether:
    type: application
    platform: iOS
    sources:
      - path: App/Aether
    dependencies:
      - package: AetherCore
      - package: GoogleCast
        product: GoogleCastDynamic
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Aether/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Aether
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    info:
      path: App/Aether/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aether
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AetherReleaseLabel: "$(AETHER_RELEASE_LABEL)"
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [arm64]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        # Lets the system offer «Cerca in Aether» under the results of its search (the words typed arrive as a search-continuation activity).
        CoreSpotlightContinuation: true
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.aether.continue
            UIApplicationShortcutItemTitle: Continua a guardare
            UIApplicationShortcutItemIconSymbolName: play.circle.fill
          - UIApplicationShortcutItemType: app.aether.search
            UIApplicationShortcutItemTitle: Cerca
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
          - UIApplicationShortcutItemType: app.aether.library
            UIApplicationShortcutItemTitle: Libreria
            UIApplicationShortcutItemIconSymbolName: books.vertical.fill
          - UIApplicationShortcutItemType: app.aether.downloads
            UIApplicationShortcutItemTitle: Altro e download
            UIApplicationShortcutItemIconSymbolName: arrow.down.circle.fill
        CFBundleURLTypes:
          - CFBundleURLName: app.aether.links
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [aether, stremio]
        NSLocalNetworkUsageDescription: "Aether usa la rete locale per trovare dispositivi Google Cast e DLNA, per raggiungere gli addon che ospiti nella tua rete e per passare al televisore, senza mostrargli la tua chiave, i video che la richiedono."
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInMediaAndWebContent: true
    scheme:
      testTargets:
        - AetherTests
        - AetherUITests
      gatherCoverageData: true
      commandLineArguments: {}

  AetherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/AetherTests
    dependencies:
      - target: Aether
      - package: AetherCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.aether.mediahub.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Aether.app/Aether
        BUNDLE_LOADER: $(TEST_HOST)

  AetherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/AetherUITests
    dependencies:
      - target: Aether
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.aether.mediahub.uitests
        TEST_TARGET_NAME: Aether
