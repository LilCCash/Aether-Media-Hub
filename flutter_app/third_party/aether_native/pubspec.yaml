name: aether_native
description: iOS only. Converts MKV to HLS on the phone (FFmpeg) and serves it to AVPlayer, AirPlay and Google Cast.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AetherNativePlugin
