name: Flutter Build (APK + IPA)

# Builds the Flutter app. On this branch a push builds only when the commit message contains [build]; the workflow can also be
# started by hand. The IPA is UNSIGNED (no certificates live in the repository): re-sign it with your own Apple ID or certificate.
on:
  push:
    branches: ['aether-flutter-comp']
    paths: ['flutter_app/**', '.github/workflows/flutter-build.yml']
  workflow_dispatch:
    inputs:
      android:
        description: 'Build the Android APK'
        type: boolean
        default: true
      ios:
        description: 'Build the unsigned iOS IPA'
        type: boolean
        default: true

concurrency:
  group: flutter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    if: github.event_name == 'workflow_dispatch' && inputs.android || github.event_name == 'push' && contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - name: Build the APKs (one per CPU family, plus a universal one)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
      - name: Check the packages
        run: |
          ls -la build/app/outputs/flutter-apk/
          for f in build/app/outputs/flutter-apk/*.apk; do unzip -l "$f" | grep -E "AndroidManifest.xml|libmpv|libapp.so" | head -4; done
      - uses: actions/upload-artifact@v4
        with:
          name: aether-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    if: github.event_name == 'workflow_dispatch' && inputs.ios || github.event_name == 'push' && contains(github.event.head_commit.message, '[build]')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - name: Build without signing
        run: flutter build ios --release --no-codesign
      - name: Pack an unsigned IPA
        run: |
          rm -rf Payload Aether-flutter-unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry Aether-flutter-unsigned.ipa Payload
          ls -la Aether-flutter-unsigned.ipa
      - name: Check the package
        run: |
          unzip -l Aether-flutter-unsigned.ipa | grep -E "Info.plist|Frameworks/Mpv|Frameworks/Libmpv|App.framework" | head -6
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Runner.app/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: aether-flutter-ipa-unsigned
          path: flutter_app/Aether-flutter-unsigned.ipa
          if-no-files-found: error
