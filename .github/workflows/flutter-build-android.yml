name: Flutter Build · Android APK

# Builds only the Android APK of the Flutter app. Start it by hand from the Actions tab (it asks which branch to build; the
# default is the Flutter branch), or put [build-android] in a commit message on aether-flutter-comp.
on:
  push:
    branches: ['aether-flutter-comp']
    paths: ['flutter_app/**', '.github/workflows/flutter-build-android.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build'
        type: string
        default: 'aether-flutter-comp'

concurrency:
  group: flutter-build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-android]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - name: Build the APKs (one per CPU family, plus a universal one)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
      - name: Check the packages
        run: |
          ls -la build/app/outputs/flutter-apk/
          for f in build/app/outputs/flutter-apk/*.apk; do unzip -l "$f" | grep -E "AndroidManifest.xml|libmpv|libapp.so" | head -4; done
      - uses: actions/upload-artifact@v4
        with:
          name: aether-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
