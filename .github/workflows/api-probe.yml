name: API probe

# Manual, read-only. Fetches the PUBLIC documentation / OpenAPI files / error responses of the services Aether integrates
# (TorBox, TMDB, TheTVDB, the OpenSubtitles Stremio addon, Cinemeta, MPVKit) from a GitHub runner, whose network is not
# restricted like the development sandbox, and prints the load-bearing parts to the log so the implementation can be
# checked against primary sources. No credential is used: authenticated endpoints are only called with a deliberately
# invalid key to observe the documented error shape.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "torbox | tmdb | tvdb | opensubtitles | cinemeta | mpvkit | players | introdb | all"
        default: all
  push:
    paths: ['.github/workflows/api-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SVC: ${{ inputs.service || 'all' }}
    steps:
      - name: Helpers
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          cat > "$RUNNER_TEMP/probe/lib.sh" <<'LIB'
          fetch() { # fetch NAME URL [curl args...]
            name="$1"; url="$2"; shift 2
            code=$(curl -sS -L -m 40 -A "Aether-api-probe/1.0" -o "$RUNNER_TEMP/probe/$name" -w '%{http_code} %{content_type} %{size_download}B' "$@" "$url" 2>&1) || code="curl-error: $code"
            echo "::group::$name  <-  $url"
            echo "HTTP $code"
          }
          end() { echo "::endgroup::"; }
          LIB

      - name: TorBox
        if: env.SVC == 'torbox' || env.SVC == 'all'
        run: |
          . "$RUNNER_TEMP/probe/lib.sh"
          fetch health https://api.torbox.app/; head -c 600 "$RUNNER_TEMP/probe/health"; echo; end
          for u in https://api.torbox.app/openapi.json https://api.torbox.app/docs https://api-docs.torbox.app/ ; do
            fetch spec "$u"; head -c 300 "$RUNNER_TEMP/probe/spec"; echo; end
          done
          fetch openapi https://api.torbox.app/openapi.json
          if jq -e .paths "$RUNNER_TEMP/probe/openapi" >/dev/null 2>&1; then
            echo "-- version/info"; jq -c '.info' "$RUNNER_TEMP/probe/openapi"
            echo "-- torrent + user paths"; jq -r '.paths | keys[]' "$RUNNER_TEMP/probe/openapi" | grep -E '/(torrents|user|queued|notifications)/' | head -60
            for p in /v1/api/torrents/checkcached /v1/api/torrents/createtorrent /v1/api/torrents/mylist /v1/api/torrents/requestdl /v1/api/user/me /v1/api/torrents/controltorrent; do
              echo "-- $p"; jq -c --arg p "$p" '.paths[$p] // "ABSENT" | with_entries(.value |= {summary, description: (.description // "" | .[0:700]), parameters: [.parameters[]? | {name, in, required, description: (.description // "" | .[0:160]), schema}], requestBody: (.requestBody // null | tostring | .[0:900]), responses: (.responses // {} | keys)})' "$RUNNER_TEMP/probe/openapi" | head -c 5000; echo
            done
            echo "-- rate-limit / limit mentions in the whole spec"; grep -o -i -E '.{80}(rate.?limit|requests per|per minute).{120}' "$RUNNER_TEMP/probe/openapi" | head -12
          fi
          end
          fetch badtoken_me https://api.torbox.app/v1/api/user/me -H "Authorization: Bearer 00000000-0000-0000-0000-000000000000"; cat "$RUNNER_TEMP/probe/badtoken_me" | head -c 800; echo; end
          fetch badtoken_cached "https://api.torbox.app/v1/api/torrents/checkcached?hash=0000000000000000000000000000000000000000&format=list" -H "Authorization: Bearer 00000000-0000-0000-0000-000000000000"; head -c 800 "$RUNNER_TEMP/probe/badtoken_cached"; echo; end
          fetch badtoken_post "https://api.torbox.app/v1/api/torrents/checkcached?format=list&list_files=true" -X POST -H "Content-Type: application/json" -H "Authorization: Bearer 00000000-0000-0000-0000-000000000000" -d '{"hashes":["0000000000000000000000000000000000000000"]}'; head -c 800 "$RUNNER_TEMP/probe/badtoken_post"; echo; end
          fetch noauth_mylist https://api.torbox.app/v1/api/torrents/mylist; head -c 600 "$RUNNER_TEMP/probe/noauth_mylist"; echo; end
          fetch badtoken_requestdl "https://api.torbox.app/v1/api/torrents/requestdl?token=00000000-0000-0000-0000-000000000000&torrent_id=1&file_id=1"; head -c 600 "$RUNNER_TEMP/probe/badtoken_requestdl"; echo; end
          echo "-- response headers of a rejected call (rate-limit headers?)"; curl -sS -m 30 -D - -o /dev/null -H "Authorization: Bearer 00000000-0000-0000-0000-000000000000" https://api.torbox.app/v1/api/user/me | head -25
          fetch terms https://torbox.app/terms; sed -e 's/<[^>]*>/ /g' "$RUNNER_TEMP/probe/terms" | tr -s ' \n' | grep -o -i -E '.{200}(third.party|api key|automated|scrap|rate|abuse|resell|share).{300}' | head -14; end

      - name: IntroDB (skip intro / recap / outro data)
        if: env.SVC == 'introdb' || env.SVC == 'all'
        run: |
          . "$RUNNER_TEMP/probe/lib.sh"
          text() { sed -e 's/<script[^>]*>[^<]*<\/script>//g' -e 's/<style[^>]*>[^<]*<\/style>//g' -e 's/<[^>]*>/ /g' "$1" | tr -s ' \n' | head -c "${2:-3500}"; echo; }
          for site in https://theintrodb.org https://introdb.app; do
            host=${site#https://}
            for path in /docs /docs/api /api /docs/api-reference /docs/best-practices /about /openapi.json /docs/openapi.json /robots.txt /sitemap.xml; do
              n="page_${host}_$(echo "$path" | tr '/' '_')"
              fetch "$n" "$site$path"
              text "$RUNNER_TEMP/probe/$n" 3000
              echo "-- links in the page"; grep -o -E '(src|href)="[^"]+"' "$RUNNER_TEMP/probe/$n" | head -25
              end
            done
            echo "::group::API urls found in the JavaScript of $site"
            for js in $(cat "$RUNNER_TEMP/probe/page_${host}__docs" "$RUNNER_TEMP/probe/page_${host}_" 2>/dev/null | grep -o -E 'src="[^"]+\.js[^"]*"' | sed -e 's/src="//' -e 's/"$//' | sort -u | head -12); do
              case "$js" in http*) u="$js";; /*) u="$site$js";; *) u="$site/$js";; esac
              curl -sS -L -m 40 -A "Aether-api-probe/1.0" "$u" -o "$RUNNER_TEMP/probe/bundle.js" 2>/dev/null || continue
              echo "# $u"; grep -o -E 'https?://[A-Za-z0-9._/-]*(introdb|api)[A-Za-z0-9._/?=&{}$-]*' "$RUNNER_TEMP/probe/bundle.js" | sort -u | head -20
              grep -o -E '.{60}/(segments|intro|media|v[0-9]/[a-z]+)[A-Za-z0-9_/?=&.-]{0,60}' "$RUNNER_TEMP/probe/bundle.js" | sort -u | head -15
            done
            end
          done
          echo "::group::guessed read endpoints (no credential)"
          for u in \
            "https://api.theintrodb.org/v2/media?tmdb_id=1399&season=1&episode=1" \
            "https://theintrodb.org/api/v2/media?tmdb_id=1399&season=1&episode=1" \
            "https://api.theintrodb.org/v1/media?tmdb_id=1399&season=1&episode=1" \
            "https://api.theintrodb.org/media?tmdb_id=1399&season=1&episode=1" \
            "https://api.theintrodb.org/v2/media?imdb_id=tt0944947&season=1&episode=1" \
            "https://api.introdb.app/segments?imdb_id=tt0944947&season=1&episode=1" \
            "https://introdb.app/api/segments?imdb_id=tt0944947&season=1&episode=1" \
            "https://api.introdb.app/intro?imdb_id=tt0944947&season=1&episode=1" ; do
            fetch guess "$u" -H "Accept: application/json"; head -c 1200 "$RUNNER_TEMP/probe/guess"; echo
            echo "-- response headers"; curl -sS -m 30 -D - -o /dev/null -A "Aether-api-probe/1.0" "$u" | head -14
          done
          end

      - name: TMDB
        if: env.SVC == 'tmdb' || env.SVC == 'all'
        run: |
          . "$RUNNER_TEMP/probe/lib.sh"
          fetch tmdb_spec https://developer.themoviedb.org/openapi/tmdb-api.json
          if jq -e .paths "$RUNNER_TEMP/probe/tmdb_spec" >/dev/null 2>&1; then
            jq -c '.info, .servers' "$RUNNER_TEMP/probe/tmdb_spec"
            jq -c '.components.securitySchemes' "$RUNNER_TEMP/probe/tmdb_spec"
            for p in /3/configuration /3/find/{external_id} /3/movie/{movie_id} /3/tv/{series_id} /3/tv/{series_id}/season/{season_number} /3/search/multi; do
              echo "-- $p"; jq -c --arg p "$p" '.paths[$p].get // "ABSENT" | {summary, parameters: [.parameters[]? | {name, in, required, schema: (.schema | {type, default, enum})}]}' "$RUNNER_TEMP/probe/tmdb_spec" | head -c 2500; echo
            done
          fi
          end
          fetch tmdb_badkey "https://api.themoviedb.org/3/configuration?api_key=invalid"; head -c 500 "$RUNNER_TEMP/probe/tmdb_badkey"; echo; end
          fetch tmdb_terms https://www.themoviedb.org/api-terms-of-use; sed -e 's/<[^>]*>/ /g' "$RUNNER_TEMP/probe/tmdb_terms" | tr -s ' \n' | grep -o -i -E '.{250}(attribution|commercial|endorsed|cache|rate limit|50 requests).{350}' | head -12; end

      - name: TheTVDB
        if: env.SVC == 'tvdb' || env.SVC == 'all'
        run: |
          . "$RUNNER_TEMP/probe/lib.sh"
          fetch tvdb_spec https://thetvdb.github.io/v4-api/swagger.yml
          python3 - <<'PY'
          import os, re
          text = open(os.path.join(os.environ["RUNNER_TEMP"], "probe", "tvdb_spec"), encoding="utf-8", errors="replace").read()
          print("size", len(text))
          for path in ["/login", "/search/remoteid/{id}", "/series/{id}/extended", "/series/{id}/episodes/{season-type}", "/series/{id}/translations/{language}", "/episodes/{id}/translations/{language}"]:
              i = text.find("\n  " + path + ":")
              print("--", path, "FOUND" if i >= 0 else "ABSENT")
              if i >= 0:
                  print(text[i:i+900])
          PY
          end
          echo "-- TVDB paths"; grep -E '^  /' "$RUNNER_TEMP/probe/tvdb_spec" | tr -d ':' | tr '\n' ' ' | head -c 3500; echo
          python3 - <<'PY'
          import os, re
          text = open(os.path.join(os.environ["RUNNER_TEMP"], "probe", "tvdb_spec"), encoding="utf-8", errors="replace").read()
          for path in ["/search/remoteid/{id}", "/series/{id}/extended", "/series/{id}/episodes/{season-type}", "/series/{id}/translations/{language}", "/movies/{id}/extended", "/search"]:
              m = re.search(r"\n  " + re.escape(path) + r":\n(.{0,1400})", text, re.S)
              print("--", path, "FOUND" if m else "ABSENT")
              if m: print(m.group(1)[:900])
          PY
          fetch tvdb_badlogin https://api4.thetvdb.com/v4/login -X POST -H "Content-Type: application/json" -d '{"apikey":"invalid"}'; head -c 500 "$RUNNER_TEMP/probe/tvdb_badlogin"; echo; end
          fetch tvdb_attr https://thetvdb.com/api-information; sed -e 's/<[^>]*>/ /g' "$RUNNER_TEMP/probe/tvdb_attr" | tr -s ' \n' | grep -o -i -E '.{200}(attribution|free|subscri|open source|commercial|user.supported).{300}' | head -12; end

      - name: OpenSubtitles (Stremio addon)
        if: env.SVC == 'opensubtitles' || env.SVC == 'all'
        run: |
          . "$RUNNER_TEMP/probe/lib.sh"
          fetch os_manifest https://opensubtitles-v3.strem.io/manifest.json; head -c 1800 "$RUNNER_TEMP/probe/os_manifest"; echo; end
          fetch os_movie https://opensubtitles-v3.strem.io/subtitles/movie/tt0111161.json; jq -c '{count: (.subtitles | length), first: .subtitles[0:3]}' "$RUNNER_TEMP/probe/os_movie" 2>/dev/null || head -c 600 "$RUNNER_TEMP/probe/os_movie"; echo
          jq -r '[.subtitles[].lang] | group_by(.) | map({(.[0]): length}) | add' "$RUNNER_TEMP/probe/os_movie" 2>/dev/null | head -c 800; echo; end
          fetch os_extra "https://opensubtitles-v3.strem.io/subtitles/movie/tt0111161/videoHash=8e245d9679d31e12&videoSize=12909756.json"; jq -c '{count: (.subtitles | length), first: .subtitles[0:2]}' "$RUNNER_TEMP/probe/os_extra" 2>/dev/null || head -c 500 "$RUNNER_TEMP/probe/os_extra"; echo; end
          fetch os_episode "https://opensubtitles-v3.strem.io/subtitles/series/tt0944947:1:1.json"; jq -c '{count: (.subtitles | length), first: .subtitles[0:2]}' "$RUNNER_TEMP/probe/os_episode" 2>/dev/null || head -c 500 "$RUNNER_TEMP/probe/os_episode"; echo; end
          url=$(jq -r '.subtitles[0].url' "$RUNNER_TEMP/probe/os_movie" 2>/dev/null)
          if [ -n "$url" ] && [ "$url" != null ]; then fetch os_file "$url"; head -c 500 "$RUNNER_TEMP/probe/os_file"; echo; end; fi
          fetch os_rest https://api.opensubtitles.com/api/v1/infos/languages -H "Api-Key: invalid"; head -c 400 "$RUNNER_TEMP/probe/os_rest"; echo; end

      - name: Cinemeta (catalog extras)
        if: env.SVC == 'cinemeta' || env.SVC == 'all'
        run: |
          . "$RUNNER_TEMP/probe/lib.sh"
          fetch cm https://v3-cinemeta.strem.io/manifest.json
          jq -c '{version, resources, types, idPrefixes, catalogs: [.catalogs[] | {type, id, name, extra: [.extra[]? | {name, isRequired, optionsCount: (.options | length), options: (.options[0:6])}], extraSupported, extraRequired}]}' "$RUNNER_TEMP/probe/cm" | head -c 4000; echo; end
          fetch cm_meta https://v3-cinemeta.strem.io/meta/series/tt0944947.json; jq -c '.meta | {id, name, imdb_id, moviedb_id, tvdb_id, year, releaseInfo, runtime, genres: .genres[0:3], logo, background, videos: (.videos | length), video0: .videos[0] }' "$RUNNER_TEMP/probe/cm_meta" | head -c 1500; echo; end
          fetch cm_search "https://v3-cinemeta.strem.io/catalog/movie/top/search=matrix.json"; jq -c '[.metas[0:3][] | {id, name, year, releaseInfo, genres}]' "$RUNNER_TEMP/probe/cm_search" | head -c 900; echo; end
          fetch cm_genre "https://v3-cinemeta.strem.io/catalog/movie/top/genre=Action.json"; jq -c '{count: (.metas | length), first: .metas[0] | {name, genres, releaseInfo}}' "$RUNNER_TEMP/probe/cm_genre" | head -c 600; echo; end

      - name: MPVKit
        if: env.SVC == 'mpvkit' || env.SVC == 'all'
        run: |
          . "$RUNNER_TEMP/probe/lib.sh"
          fetch mpv_releases "https://api.github.com/repos/mpvkit/MPVKit/releases?per_page=6"
          jq -r '.[] | "\(.tag_name)  \(.published_at)  prerelease=\(.prerelease)  assets=\(.assets | length)"' "$RUNNER_TEMP/probe/mpv_releases" 2>/dev/null | head; end
          fetch mpv_package https://raw.githubusercontent.com/mpvkit/MPVKit/main/Package.swift; head -c 6000 "$RUNNER_TEMP/probe/mpv_package"; echo; end
          fetch mpv_license https://api.github.com/repos/mpvkit/MPVKit/license; jq -c '{license: .license.spdx_id, name: .license.name}' "$RUNNER_TEMP/probe/mpv_license"; end
          fetch mpv_readme https://raw.githubusercontent.com/mpvkit/MPVKit/main/README.md; head -c 5000 "$RUNNER_TEMP/probe/mpv_readme"; echo; end
          fetch mpv_tree "https://api.github.com/repos/mpvkit/MPVKit/git/trees/main?recursive=1"; jq -r '.tree[].path' "$RUNNER_TEMP/probe/mpv_tree" 2>/dev/null | grep -i -E 'demo|example|\.swift$' | head -40; end

      - name: Alternative playback engines (licence and scope only)
        if: env.SVC == 'players' || env.SVC == 'all'
        run: |
          . "$RUNNER_TEMP/probe/lib.sh"
          for repo in superuser404notfound/AetherEngine kingslay/KSPlayer videolan/vlc-ios; do
            n=$(echo "$repo" | tr '/' '_')
            fetch "lic_$n" "https://api.github.com/repos/$repo/license"; jq -c '{license: .license.spdx_id, name: .license.name}' "$RUNNER_TEMP/probe/lic_$n" 2>/dev/null | head -c 300; echo; end
            fetch "info_$n" "https://api.github.com/repos/$repo"; jq -c '{full_name, description, archived, pushed_at, stargazers_count, default_branch}' "$RUNNER_TEMP/probe/info_$n" 2>/dev/null | head -c 600; echo; end
            fetch "readme_$n" "https://api.github.com/repos/$repo/readme" -H "Accept: application/vnd.github.raw"; head -c 5500 "$RUNNER_TEMP/probe/readme_$n"; echo; end
          done
          fetch ae_package https://raw.githubusercontent.com/superuser404notfound/AetherEngine/main/Package.swift; head -c 4000 "$RUNNER_TEMP/probe/ae_package"; echo; end
          fetch ae_tree "https://api.github.com/repos/superuser404notfound/AetherEngine/git/trees/main?recursive=1"; jq -r '.tree[].path' "$RUNNER_TEMP/probe/ae_tree" 2>/dev/null | head -80; end

      - name: Keep the raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-probe-responses
          path: ${{ runner.temp }}/probe
          retention-days: 7
          if-no-files-found: ignore
