name: Build IPA

# Composes Aether.ipa on a GitHub macOS runner; this workflow is also used to validate the main-secondary build.
#
#   unsigned  (default, no credentials needed; validates current UI, custom accent color, catalog settings, metadata integrations, and playback paths)
#       Builds a Release archive for real iPhones (arm64) with code signing disabled and packs it as
#       Aether-unsigned.ipa. iOS refuses to install an unsigned IPA as it is: it has to be re-signed first, for example
#       with your own Apple ID through AltStore / Sideloadly, or with a certificate of your own. The job checks the
#       package it produced (bundle id, arm64 binary, embedded Google Cast framework, icon, no leftover signature).
#
#   signed    (only when you tick "sign" in the manual run; NOT VERIFIED, it has never run: it needs your credentials)
#       Signs with your Apple certificate and provisioning profile and exports a ready-to-install IPA. It never asks
#       for an Apple ID password. Repository secrets (Settings > Secrets and variables > Actions):
#         APPLE_TEAM_ID                 10-character team id
#         APP_BUNDLE_ID                 bundle id registered in your profile, e.g. com.yourname.aether
#         BUILD_CERTIFICATE_BASE64      base64 of the exported .p12 (Apple Development / Distribution)
#         P12_PASSWORD                  password chosen when exporting the .p12
#         PROVISIONING_PROFILE_BASE64   base64 of the .mobileprovision for APP_BUNDLE_ID
#
# Triggers: manual run (Actions > Build IPA > Run workflow; tick "publish_release" and give a tag to also publish the
# unsigned IPA as a GitHub pre-release), a pushed tag "v*" (same release), and any change to this file (so the workflow
# is exercised whenever it is edited).
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Also build a signed IPA with your own certificate (needs the secrets listed in the header)
        type: boolean
        default: false
      publish_release:
        description: Publish the unsigned IPA as a GitHub pre-release (needs release_tag)
        type: boolean
        default: false
      official_release:
        description: Publish as an official release (not marked as a pre-release)
        type: boolean
        default: false
      release_tag:
        description: "Tag of the release, for example v1.0.0-alpha.1 (created on the built commit if it does not exist yet)"
        type: string
        default: ''
      export_method:
        description: "Signed build only: development | ad-hoc | app-store-connect (must match the certificate and profile)"
        type: choice
        options: [development, ad-hoc, app-store-connect]
        default: development
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['.github/workflows/build-ipa.yml']

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unsigned:
    name: Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Aether.xcodeproj -scheme Aether \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Aether.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -25

      - name: Pack Aether-unsigned.ipa
        run: |
          APP="$RUNNER_TEMP/Aether.xcarchive/Products/Applications/Aether.app"
          test -d "$APP" || { echo "::error::The archive contains no Aether.app"; exit 1; }
          rm -rf "$RUNNER_TEMP/ipa-staging" && mkdir -p "$RUNNER_TEMP/ipa-staging/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa-staging/Payload/Aether.app"
          (cd "$RUNNER_TEMP/ipa-staging" && zip -qry "$GITHUB_WORKSPACE/Aether-unsigned.ipa" Payload)
          ls -lh Aether-unsigned.ipa

      - name: Verify the package
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/check" && mkdir "$RUNNER_TEMP/check"
          unzip -q Aether-unsigned.ipa -d "$RUNNER_TEMP/check"
          APP="$RUNNER_TEMP/check/Payload/Aether.app"
          INFO="$APP/Info.plist"
          fail=0
          check() { if [ "$1" = ok ]; then echo "  ok   $2"; else echo "::error::$2"; fail=1; fi; }

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          MINOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO")
          echo "bundle id $BUNDLE_ID, version $VERSION ($BUILD), minimum iOS $MINOS"

          # Expectations come from the repository's own configuration, not from constants repeated here.
          WANT_BUNDLE_ID=$(sed -nE 's/^APP_BUNDLE_ID[[:space:]]*=[[:space:]]*//p' Config/Shared.xcconfig | head -1)
          WANT_VERSION=$(sed -nE 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' Config/Shared.xcconfig | head -1)
          WANT_MINOS=$(sed -nE 's/^[[:space:]]*iOS:[[:space:]]*"?([0-9.]+)"?.*/\1/p' project.yml | head -1)
          [ "$BUNDLE_ID" = "$WANT_BUNDLE_ID" ] && check ok "bundle identifier $WANT_BUNDLE_ID" || check bad "bundle identifier is $BUNDLE_ID, expected $WANT_BUNDLE_ID"
          [ "$VERSION" = "$WANT_VERSION" ] && check ok "marketing version $WANT_VERSION" || check bad "version is $VERSION, expected $WANT_VERSION"
          [ "$MINOS" = "$WANT_MINOS" ] && check ok "deployment target $WANT_MINOS" || check bad "minimum iOS is $MINOS, expected $WANT_MINOS"
          [ "$BUILD" = "${{ github.run_number }}" ] && check ok "build number = run number (${{ github.run_number }})" || check bad "build number is $BUILD, expected ${{ github.run_number }}"

          ARCHS=$(lipo -archs "$APP/Aether")
          [ "$ARCHS" = "arm64" ] && check ok "executable is arm64 only" || check bad "unexpected architectures: $ARCHS"
          # A device build must not contain the simulator slice.
          vtool -show-build "$APP/Aether" | grep -q "platform IOS$" && check ok "built for the iOS device platform" || check bad "binary is not a device (IOS) build"

          # The label shown in Settings > Informazioni comes from the same configuration file.
          WANT_LABEL=$(sed -nE 's/^AETHER_RELEASE_LABEL[[:space:]]*=[[:space:]]*//p' Config/Shared.xcconfig | head -1)
          LABEL=$(/usr/libexec/PlistBuddy -c 'Print :AetherReleaseLabel' "$INFO" 2>/dev/null || true)
          [ "$LABEL" = "$WANT_LABEL" ] && check ok "release label \"$WANT_LABEL\"" || check bad "release label is \"$LABEL\", expected \"$WANT_LABEL\""

          # Picture in Picture and background sound need the "audio" background mode; Google Cast discovery needs its Bonjour services.
          plutil -extract UIBackgroundModes json -o - "$INFO" 2>/dev/null | grep -q '"audio"' && check ok "background mode audio (sound in the background, Picture in Picture)" || check bad "UIBackgroundModes does not contain audio"
          plutil -extract NSBonjourServices json -o - "$INFO" 2>/dev/null | grep -q '_googlecast._tcp' && check ok "Bonjour service _googlecast._tcp declared (Google Cast discovery)" || check bad "NSBonjourServices does not declare _googlecast._tcp"

          # MPVKit (libmpv + FFmpeg) is linked statically; its presence shows as FFmpeg's version string. Information only.
          if strings -a "$APP/Aether" | grep -q "Lavc"; then echo "  info  FFmpeg (libavcodec) is linked into the executable"; else echo "  info  no libavcodec version string found in the executable"; fi
          echo "  info  executable size $(du -h "$APP/Aether" | cut -f1), package $(du -h Aether-unsigned.ipa | cut -f1)"

          [ -d "$APP/Frameworks/GoogleCast.framework" ] && check ok "Google Cast framework embedded" || check bad "GoogleCast.framework is missing from Frameworks/"
          [ -f "$APP/Assets.car" ] && check ok "asset catalog compiled" || check bad "Assets.car is missing"
          if xcrun assetutil --info "$APP/Assets.car" 2>/dev/null | grep -q '"Name" : "AppIcon"' \
             || /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$INFO" 2>/dev/null | grep -qx AppIcon; then
            check ok "app icon is in the catalog"
          else
            check bad "no AppIcon found in Assets.car or Info.plist"
            plutil -p "$INFO" | grep -i icon || true
          fi
          [ -f "$APP/PrivacyInfo.xcprivacy" ] && check ok "privacy manifest present" || check bad "PrivacyInfo.xcprivacy is missing"
          SCHEMES=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes' "$INFO" 2>/dev/null || true)
          echo "$SCHEMES" | grep -qw aether && echo "$SCHEMES" | grep -qw stremio && check ok "URL schemes aether and stremio registered" || check bad "URL schemes aether/stremio missing"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$INFO" >/dev/null 2>&1 && check ok "local network usage description" || check bad "NSLocalNetworkUsageDescription missing"

          if codesign -dv "$APP" 2>&1 | grep -q "not signed at all"; then
            check ok "unsigned, as intended (re-sign before installing)"
          else
            echo "note: the bundle carries a signature"; codesign -dv "$APP" 2>&1 | head -5
          fi
          exit $fail

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aether-unsigned-ipa
          path: Aether-unsigned.ipa
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  release:
    name: Attach the unsigned IPA to a GitHub release
    needs: unsigned
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Aether-unsigned-ipa
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          OFFICIAL: ${{ inputs.official_release }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "::error::The release tag must look like v1.0.0 or v1.0.0-alpha.1 (got '$TAG')"
            exit 1
          fi
          ls -lh Aether-unsigned.ipa
          NOTES="Unsigned IPA built by GitHub Actions from commit ${SHA} (build number ${RUN_NUMBER}). iOS will not install it as it is: re-sign it with your own Apple ID (AltStore, Sideloadly) or your own certificate. Not tested on a physical iPhone; AirPlay, Google Cast, DLNA and VoiceOver are implemented but unverified on hardware. See the README for the real status of every feature."
          # Release notes live in the repository (docs/release-notes/<tag>.md); the generic text is the fallback.
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            printf '\n\nBuilt from commit %s (build number %s).\n' "$SHA" "$RUN_NUMBER" > "$RUNNER_TEMP/notes-footer.md"
            cat "$NOTES_FILE" "$RUNNER_TEMP/notes-footer.md" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          fi
          # An official release replaces an earlier one of the same tag (and the same version spelled with a trailing .0).
          if [ "$OFFICIAL" = "true" ]; then
            for OLD in "$TAG" "${TAG}.0"; do
              if gh release view "$OLD" >/dev/null 2>&1; then gh release delete "$OLD" --cleanup-tag --yes; fi
            done
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Aether-unsigned.ipa --clobber
          else
            if [ "$OFFICIAL" = "true" ]; then
              gh release create "$TAG" Aether-unsigned.ipa --target "$SHA" --title "Aether ${TAG#v} (IPA non firmato)" --notes-file "$RUNNER_TEMP/notes.md" --latest
            else
              gh release create "$TAG" Aether-unsigned.ipa --target "$SHA" --title "Aether $TAG (unsigned IPA)" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
            fi
          fi
          gh release view "$TAG" --json url,tagName,isPrerelease,assets --jq '{url, tagName, isPrerelease, assets: [.assets[] | {name, size}]}'

  signed:
    name: Signed IPA (your credentials)
    if: github.event_name == 'workflow_dispatch' && inputs.sign
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the signing secrets exist
        run: |
          missing=0
          for name in APPLE_TEAM_ID APP_BUNDLE_ID BUILD_CERTIFICATE_BASE64 P12_PASSWORD PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          exit $missing

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import the certificate and the provisioning profile
        run: |
          KEYCHAIN="$RUNNER_TEMP/aether-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -E '^[[:space:]]*[0-9]+\)' || true)
          COUNT=$(printf '%s\n' "$IDENTITIES" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one valid code-signing identity in the .p12, found $COUNT. Export a .p12 with only the certificate you want to use."
            printf '%s\n' "$IDENTITIES"
            exit 1
          fi
          SIGNING_IDENTITY=$(printf '%s\n' "$IDENTITIES" | sed -E 's/.*"(.+)"/\1/')
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $SIGNING_IDENTITY / profile: $PROFILE_NAME"

      - name: Generate the project with your team and bundle id
        run: |
          printf 'DEVELOPMENT_TEAM = %s\nAPP_BUNDLE_ID = %s\n' "$APPLE_TEAM_ID" "$APP_BUNDLE_ID" > Config/Signing.local.xcconfig
          xcodegen generate

      # The manual-signing settings are given on the command line because project.yml pins CODE_SIGN_STYLE for the
      # project. Command-line settings reach every target, so they would break a Swift Package that ships resources;
      # the Google Cast package is therefore pinned to an exact version (project.yml). Re-check this when bumping it.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Aether.xcodeproj -scheme Aether \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Aether.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -40

      - name: Export the IPA
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": os.environ["EXPORT_METHOD"],
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "provisioningProfiles": {os.environ["APP_BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as handle:
              plistlib.dump(options, handle)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Aether.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          ls -lh "$RUNNER_TEMP/ipa"

      - name: Verify what was produced
        run: |
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          test -f "$IPA" || { echo "::error::No IPA was produced"; exit 1; }
          rm -rf "$RUNNER_TEMP/unpacked" && mkdir "$RUNNER_TEMP/unpacked"
          unzip -q "$IPA" -d "$RUNNER_TEMP/unpacked"
          APP="$RUNNER_TEMP/unpacked/Payload/Aether.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" || true
          test -f "$APP/embedded.mobileprovision" || { echo "::error::The IPA has no provisioning profile"; exit 1; }
          echo "IPA verified: signature valid and profile embedded."

      - name: Upload the signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aether-signed-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/aether-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
