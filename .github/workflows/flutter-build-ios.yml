name: Flutter Build · iOS IPA

# Builds only the iOS IPA of the Flutter app. It is UNSIGNED (no certificates live in the repository): re-sign it with your own
# Apple ID or certificate. Start it by hand from the Actions tab (it asks which branch to build; the default is the Flutter
# branch), or put [build-ios] in a commit message on aether-flutter-ios.
on:
  push:
    branches: ['aether-flutter-ios']
    paths: ['flutter_app/**', '.github/workflows/flutter-build-ios.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build'
        type: string
        default: 'aether-flutter-ios'

concurrency:
  group: flutter-build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS IPA (unsigned)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-ios]')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      # The downloaded iOS libraries (CocoaPods) and the pub packages are kept between builds; a changed lock file starts a new cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            flutter_app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('flutter_app/pubspec.lock', 'flutter_app/ios/Podfile', 'flutter_app/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - run: flutter pub get
      - name: Build without signing
        run: flutter build ios --release --no-codesign
      - name: Pack an unsigned IPA
        run: |
          rm -rf Payload Aether-flutter-unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry Aether-flutter-unsigned.ipa Payload
          ls -la Aether-flutter-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: aether-flutter-ipa-unsigned
          path: flutter_app/Aether-flutter-unsigned.ipa
          if-no-files-found: error
