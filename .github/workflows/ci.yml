name: CI

# Cost note: on a private repository GitHub bills macOS runner minutes at 10x. The UI tests take ~15 minutes, so they
# run only on main and on manual runs ("Run workflow"); every other push builds the app and runs the unit tests on one
# macOS machine (the simulator boots during the build). The `changes` job skips what a push cannot affect: the macOS Core
# job when the Core is untouched, the app job when only Android or tooling files changed, the video-conversion tests when
# the conversion / relay / playback code is untouched.
# Documentation-only changes do not start the workflow.
# A commit message with [skip ci] starts neither this workflow nor the IPA build (handy to gather several changes before one build).
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  workflow_dispatch:
    inputs:
      ui_tests:
        description: "UI tests to run (empty = none, the default): -only-testing targets separated by commas, for example AetherUITests/LayoutUITests,AetherUITests/BrowseUITests, or AetherUITests for all"
        default: ''

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ui_tests }}
  cancel-in-progress: true

jobs:
  # Which parts of the repository the push touched, so the expensive macOS jobs run only when they can find something.
  # Anything that cannot be decided (a new branch, a manual run, main, a change to this file or to project.yml) runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.diff.outputs.full }}
      core: ${{ steps.diff.outputs.core }}
      app: ${{ steps.diff.outputs.app }}
      remux: ${{ steps.diff.outputs.remux }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with the previous state
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          full=false
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$REF" = "refs/heads/main" ]; then
            full=true
          elif [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE" HEAD) || full=true
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            full=true
          else
            files=$(git diff --name-only "$BEFORE" HEAD) || full=true
          fi
          files=${files:-}
          if [ "$full" = false ] && echo "$files" | grep -qE '^(\.github/workflows/ci\.yml|project\.yml)$'; then full=true; fi
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          core=$(has '^Packages/AetherCore/')
          app=$(has '^(App/|Packages/AetherCore/Sources/|Packages/AetherCore/Package|Tools/|Config/|Scripts/)')
          remux=$(has '^(App/Aether/Services/(Remux|Relay|Playback)/|App/AetherTests/(FFmpeg|LocalRemux|Conversion)|Packages/AetherCore/Sources/AetherCore/(Remux|Relay)/)')
          if [ "$full" = true ]; then core=true; app=true; remux=true; fi
          echo "Changed files:"; echo "$files" | head -40
          echo "full=$full core=$core app=$app remux=$remux"
          { echo "full=$full"; echo "core=$core"; echo "app=$app"; echo "remux=$remux"; } >> "$GITHUB_OUTPUT"

  # Fast feedback (about 2 minutes, cheap Linux runner): the Core is pure Swift. Tests that need Apple frameworks skip themselves there
  # and run in the macOS jobs below. Same script as `Scripts/test-core.sh`.
  core-linux:
    name: AetherCore on Linux (fast)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ui]')"
    container: swift:6.0.3-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run AetherCore tests
        working-directory: Packages/AetherCore
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee core-linux.log | grep -E "error:|Executed [0-9]+ tests?|failed \(|Fatal|crashed" | sort -u | tail -25
          ! grep -E "error: -\[|Fatal error|Program crashed" core-linux.log

  core:
    name: AetherCore (swift test)
    runs-on: macos-latest
    needs: changes
    # The Linux job above runs the same tests on every push; this one adds the Apple-only ones when the Core changed.
    if: "!contains(github.event.head_commit.message, '[ui]') && needs.changes.outputs.core == 'true'"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version || true
          xcodebuild -showsdks | head -30

      - name: Run AetherCore tests
        working-directory: Packages/AetherCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/core-test.log"

      - name: Core results summary
        if: always()
        run: |
          grep -E "Executed [0-9]+ tests?" "$RUNNER_TEMP/core-test.log" | tail -2 || true
          grep -E "error:|failed \(" "$RUNNER_TEMP/core-test.log" | sort -u | head -20 || true

  # One macOS machine builds the app once and runs, in order: the unit tests, then (when asked) the UI tests or the
  # screenshot tour. The simulator boots while the app compiles, so the tests start as soon as the build ends.
  app:
    name: App (build, unit tests, screenshots, UI tests)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: write
    timeout-minutes: 150
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: xcodebuild -version

      # The Swift packages (MPVKit and GoogleCast are large binaries) are kept between runs instead of being downloaded again.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/AetherCore/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          names = sorted({d["name"] for runtime, items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone") and d.get("isAvailable", True)})
          pick = next((n for n in reversed(names) if "Pro Max" in n), None) or next((n for n in reversed(names) if "Pro" in n), None) or names[-1]
          print(pick)')
          UDID=$(xcrun simctl list devices available -j | NAME="$NAME" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"] == os.environ["NAME"] and d.get("isAvailable", True)))')
          echo "Using simulator: $NAME ($UDID)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Booting a simulator takes a few minutes: it happens in the background while the app compiles.
      - name: Boot the simulator during the build
        run: nohup bash -c 'start=$(date +%s); xcrun simctl boot "$0"; echo "boot took $(( $(date +%s) - start )) s"' "${{ steps.sim.outputs.udid }}" > "$RUNNER_TEMP/sim-boot.log" 2>&1 &

      # Xcode 26 compilation caching: compiled units are stored by the hash of their inputs, so an unchanged file is not
      # compiled again in the next run, and a changed one never reuses a stale result. The store is kept between runs.
      - name: Restore the compilation cache
        uses: actions/cache@v4
        with:
          path: ~/CompilationCache
          key: xcode-cas-${{ runner.os }}-${{ github.sha }}
          restore-keys: xcode-cas-${{ runner.os }}-

      # The simulator keychain needs a (ad-hoc) code signature, so signing is not disabled here.
      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Aether.xcodeproj -scheme Aether \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$HOME/CompilationCache" \
            -showBuildTimingSummary \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" 2>&1 | tee "$RUNNER_TEMP/build.log"
          du -sh "$HOME/CompilationCache" 2>/dev/null || echo "no compilation cache written"
          sed -n '/Build Timing Summary/,$p' "$RUNNER_TEMP/build.log" | head -25

      - name: Wait for the simulator
        if: steps.build.outcome == 'success'
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b || { cat "$RUNNER_TEMP/sim-boot.log"; exit 1; }
          cat "$RUNNER_TEMP/sim-boot.log"

      # The video-conversion tests (real FFmpeg conversions played by AVPlayer, about 1.5 minutes) run when the conversion,
      # relay or playback code changed, on main and on manual runs; the other unit tests run on every push. A commit marked
      # [ui] (look-only changes) skips the unit tests; a manual run that asks for UI tests skips them too (the push ran them).
      - name: Unit tests
        id: unit
        if: steps.build.outcome == 'success' && !contains(github.event.head_commit.message, '[ui]') && !(github.event_name == 'workflow_dispatch' && inputs.ui_tests != '')
        env:
          REMUX: ${{ needs.changes.outputs.remux }}
        run: |
          set -o pipefail
          SKIP=()
          if [ "$REMUX" != "true" ]; then
            SKIP+=(-skip-testing:AetherTests/FFmpegRemuxEngineTests)
            echo "Conversion code unchanged: FFmpegRemuxEngineTests skipped."
          fi
          xcodebuild test-without-building \
            -project Aether.xcodeproj -scheme Aether \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages" -disableAutomaticPackageResolution \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:AetherTests "${SKIP[@]}" \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" 2>&1 | tee "$RUNNER_TEMP/unit.log"

      - name: Generate the media matrix
        id: media
        if: "!cancelled() && steps.build.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.ui_tests != ''))"
        run: |
          set -euo pipefail
          brew install ffmpeg > "$RUNNER_TEMP/brew-ffmpeg.log" 2>&1 || { tail -20 "$RUNNER_TEMP/brew-ffmpeg.log"; exit 1; }
          ffmpeg -version | head -1
          mkdir -p "$RUNNER_TEMP/media"
          cd "$RUNNER_TEMP/media"
          V="-f lavfi -i testsrc2=size=640x360:rate=24:duration=60"
          A="-f lavfi -i sine=frequency=440:sample_rate=48000:duration=60"
          F="ffmpeg -nostdin -loglevel error -y"
          $F $V $A -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k -shortest h264.mkv
          $F -i h264.mkv -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a libmp3lame h264.avi
          HDR10="colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400:repeat-headers=1:log-level=error"
          $F $V $A -vf format=yuv420p10le -c:v libx265 -preset ultrafast -profile:v main10 -tag:v hvc1 -x265-params "$HDR10" -c:a aac -b:a 96k -shortest hdr10.mp4
          $F -i hdr10.mp4 -c copy hdr10.mkv
          $F -i hdr10.mp4 -c copy -tag:v hev1 hdr10-hev1.mp4
          HLG="colorprim=bt2020:transfer=arib-std-b67:colormatrix=bt2020nc:repeat-headers=1:log-level=error"
          $F $V $A -vf format=yuv420p10le -c:v libx265 -preset ultrafast -profile:v main10 -tag:v hvc1 -x265-params "$HLG" -c:a aac -b:a 96k -shortest hlg.mp4
          $F $V $A -vf format=yuv420p -c:v libx265 -preset ultrafast -tag:v hvc1 -x265-params "log-level=error" -c:a aac -b:a 96k -shortest sdr-hevc.mp4
          for f in *; do
            echo "== $f ($(stat -f%z "$f") bytes)"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,codec_tag_string,profile,pix_fmt,color_space,color_transfer,color_primaries -of compact=p=0 "$f"
          done

      - name: Start the fixture addon server
        id: fixture
        if: "!cancelled() && steps.build.outcome == 'success' && (((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.ui_tests != '')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]')))"
        run: |
          swiftc -O Tools/MakeFixtureVideo.swift -o "$RUNNER_TEMP/makevideo"
          "$RUNNER_TEMP/makevideo" "$RUNNER_TEMP/sample.mp4" 150
          # Listen on every interface: the download test reaches the server through the machine's LAN address.
          nohup node Tools/FixtureAddonServer/server.js --port 7777 --host 0.0.0.0 --video "$RUNNER_TEMP/sample.mp4" --media-dir "$RUNNER_TEMP/media" > "$RUNNER_TEMP/fixture.log" 2>&1 &
          # Stand-in for the TorBox API (the app is pointed at it by -AETHER_UITEST_TORBOX_URL); loopback only, serves the same sample video.
          nohup node Tools/FixtureTorBoxServer/server.js --port 7778 --video "$RUNNER_TEMP/sample.mp4" > "$RUNNER_TEMP/torbox-fixture.log" 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:7778/ | head -c 200
          LAN_IP=$(ipconfig getifaddr en0 || ipconfig getifaddr en1 || true)
          echo "LAN address: ${LAN_IP:-none}"
          echo "lan_ip=$LAN_IP" >> "$GITHUB_OUTPUT"
          curl -fsS http://127.0.0.1:7777/manifest.json | head -c 200
          curl -fsSI -H "Range: bytes=0-99" http://127.0.0.1:7777/media/sample.mp4 | head -5

      - name: UI tests
        id: ui
        if: "!cancelled() && steps.fixture.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.ui_tests != ''))"
        env:
          UI_TESTS: ${{ inputs.ui_tests }}
        timeout-minutes: 90
        run: |
          set -o pipefail
          # UI_TESTS may list several targets separated by commas (AetherUITests/LayoutUITests,AetherUITests/BrowseUITests).
          ONLY=()
          IFS=',' read -ra TARGETS <<< "${UI_TESTS:-AetherUITests}"
          for target in "${TARGETS[@]}"; do ONLY+=("-only-testing:$target"); done
          TEST_RUNNER_AETHER_FIXTURE_LAN_HOST="${{ steps.fixture.outputs.lan_ip }}" \
          xcodebuild test-without-building \
            -project Aether.xcodeproj -scheme Aether \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages" -disableAutomaticPackageResolution \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            "${ONLY[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" 2>&1 | tee "$RUNNER_TEMP/ui.log"

      # A commit whose message contains [shots] photographs the main screens in light and dark (ScreenshotTourUITests) and
      # publishes the pictures on the ci-screenshots branch (replaced every time), so the look can be checked without a phone.
      - name: Screenshot tour
        id: shots
        if: "!cancelled() && steps.fixture.outcome == 'success' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]'))"
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          TEST_RUNNER_AETHER_SCREENSHOT_DIR="$RUNNER_TEMP/shots" \
          xcodebuild test-without-building \
            -project Aether.xcodeproj -scheme Aether \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages" -disableAutomaticPackageResolution \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:AetherUITests/ScreenshotTourUITests \
            -resultBundlePath "$RUNNER_TEMP/shots.xcresult" 2>&1 | tee "$RUNNER_TEMP/shots.log" | grep -E "Test Case|error:|TOUR-SHOT" || true
          ls -la "$RUNNER_TEMP/shots"

      # Any other branch keeps its pictures as a run artifact, so ci-screenshots always shows the main iOS branch.
      - name: Keep the screenshots as an artifact
        if: "!cancelled() && steps.shots.outcome == 'success'"
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish the screenshots
        if: "!cancelled() && steps.shots.outcome == 'success' && github.ref_name == 'aether-swift-features'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/shots"
          ls *.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          echo "${GITHUB_SHA}" > COMMIT.txt
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.name="aether-ci" -c user.email="aether-ci@users.noreply.github.com" commit -qm "Screenshot ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-bundles
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Results summary
        if: always()
        run: |
          echo "=== compiler errors ==="
          grep -E "error:" "$RUNNER_TEMP/build.log" | grep -v "^note" | sort -u | head -40 || true
          echo "=== unit tests ==="
          grep -E "Executed [0-9]+ tests?" "$RUNNER_TEMP/unit.log" | tail -2 || true
          grep -E "error: -\[|Test Case .* failed" "$RUNNER_TEMP/unit.log" | sort -u | head -40 || true
          echo "=== screenshot tour ==="
          grep -E "error:|Test Case .* (passed|failed)" "$RUNNER_TEMP/shots.log" | cut -c1-400 | tail -12 || true
          grep -c "TOUR-SHOT" "$RUNNER_TEMP/shots.log" || true
          echo "=== UI tests ==="
          grep -E "Executed [0-9]+ tests?" "$RUNNER_TEMP/ui.log" | tail -2 || true
          grep -E "Test Case .* (passed|failed)" "$RUNNER_TEMP/ui.log" | sed -E 's/.*Test Case .-\[AetherUITests\.//' | head -60 || true
          grep -E "error: -\[" "$RUNNER_TEMP/ui.log" | sort -u | head -40 || true
          echo "=== media matrix (what the info sheet showed) ==="
          grep -h "MATRIX-LINE" "$RUNNER_TEMP/ui.log" | sort -u | head -40 || true
          echo "=== accessibility audit notes ==="
          grep -h "A11Y-ISSUE" "$RUNNER_TEMP/ui.log" | sort -u | head -30 || true
          echo "=== fixture server ==="
          tail -5 "$RUNNER_TEMP/fixture.log" || true
          echo "=== TOTALS ==="
          echo "unit: $(grep -E 'Executed [0-9]+ tests?' "$RUNNER_TEMP/unit.log" | tail -1 | sed -E 's/^[[:space:]]*//')"
          echo "ui:   $(grep -E 'Executed [0-9]+ tests?' "$RUNNER_TEMP/ui.log" | tail -1 | sed -E 's/^[[:space:]]*//')"
