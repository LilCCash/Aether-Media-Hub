name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: AetherCore (swift test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version || true
          xcodebuild -showsdks | head -30

      - name: Run AetherCore tests
        working-directory: Packages/AetherCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/core-test.log"
