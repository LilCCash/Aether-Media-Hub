name: CI

# Cost note: on a private repository GitHub bills macOS runner minutes at 10x. The UI tests take ~15 minutes, so they
# run only on main and on manual runs ("Run workflow"); every other push builds the app and runs the unit tests (~4 min).
# Documentation-only changes do not start the workflow.
on:
  push:
    # The Flutter branch has its own workflows (Flutter CI, Flutter Build): the iOS app's CI is not run for it.
    branches: ['**', '!aether-flutter-comp', '!aether-flutter-ios', '!aether-flutter-android']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    branches-ignore: ['aether-flutter-comp', 'aether-flutter-ios', 'aether-flutter-android']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  workflow_dispatch:
    inputs:
      ui_tests:
        description: "UI tests to run, as -only-testing targets separated by commas (for example AetherUITests/LayoutUITests,AetherUITests/BrowseUITests)"
        default: AetherUITests

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ui_tests }}
  cancel-in-progress: true

jobs:
  core:
    name: AetherCore (swift test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version || true
          xcodebuild -showsdks | head -30

      - name: Run AetherCore tests
        working-directory: Packages/AetherCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/core-test.log"

      - name: Core results summary
        if: always()
        run: |
          grep -E "Executed [0-9]+ tests?" "$RUNNER_TEMP/core-test.log" | tail -2 || true
          grep -E "error:|failed \(" "$RUNNER_TEMP/core-test.log" | sort -u | head -20 || true

  app:
    name: App (build, unit tests, UI tests)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          node --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          names = sorted({d["name"] for runtime, items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone") and d.get("isAvailable", True)})
          pick = next((n for n in reversed(names) if "Pro Max" in n), None) or next((n for n in reversed(names) if "Pro" in n), None) or names[-1]
          print(pick)')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # The simulator keychain needs a (ad-hoc) code signature, so signing is not disabled here.
      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Aether.xcodeproj -scheme Aether \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Unit tests
        id: unit
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Aether.xcodeproj -scheme Aether \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:AetherTests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" 2>&1 | tee "$RUNNER_TEMP/unit.log"

      # Real files for the playback matrix. The pictures are synthetic test patterns: only the container, the codec and the
      # colour signalling (HDR10 / HLG metadata, hvc1 vs hev1 tags) are real, which is what the probe and the planner read.
      # Dolby Vision cannot be produced here (no encoder), so it is not part of the matrix.
      - name: Generate the media matrix
        id: media
        if: steps.build.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          brew install ffmpeg > "$RUNNER_TEMP/brew-ffmpeg.log" 2>&1 || { tail -20 "$RUNNER_TEMP/brew-ffmpeg.log"; exit 1; }
          ffmpeg -version | head -1
          mkdir -p "$RUNNER_TEMP/media"
          cd "$RUNNER_TEMP/media"
          V="-f lavfi -i testsrc2=size=640x360:rate=24:duration=60"
          A="-f lavfi -i sine=frequency=440:sample_rate=48000:duration=60"
          F="ffmpeg -nostdin -loglevel error -y"
          $F $V $A -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 96k -shortest h264.mkv
          $F -i h264.mkv -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a libmp3lame h264.avi
          HDR10="colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400:repeat-headers=1:log-level=error"
          $F $V $A -vf format=yuv420p10le -c:v libx265 -preset ultrafast -profile:v main10 -tag:v hvc1 -x265-params "$HDR10" -c:a aac -b:a 96k -shortest hdr10.mp4
          $F -i hdr10.mp4 -c copy hdr10.mkv
          $F -i hdr10.mp4 -c copy -tag:v hev1 hdr10-hev1.mp4
          HLG="colorprim=bt2020:transfer=arib-std-b67:colormatrix=bt2020nc:repeat-headers=1:log-level=error"
          $F $V $A -vf format=yuv420p10le -c:v libx265 -preset ultrafast -profile:v main10 -tag:v hvc1 -x265-params "$HLG" -c:a aac -b:a 96k -shortest hlg.mp4
          $F $V $A -vf format=yuv420p -c:v libx265 -preset ultrafast -tag:v hvc1 -x265-params "log-level=error" -c:a aac -b:a 96k -shortest sdr-hevc.mp4
          for f in *; do
            echo "== $f ($(stat -f%z "$f") bytes)"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,codec_tag_string,profile,pix_fmt,color_space,color_transfer,color_primaries -of compact=p=0 "$f"
          done

      - name: Start the fixture addon server
        id: fixture
        if: steps.build.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        run: |
          swiftc -O Tools/MakeFixtureVideo.swift -o "$RUNNER_TEMP/makevideo"
          "$RUNNER_TEMP/makevideo" "$RUNNER_TEMP/sample.mp4" 150
          # Listen on every interface: the download test reaches the server through the machine's LAN address.
          nohup node Tools/FixtureAddonServer/server.js --port 7777 --host 0.0.0.0 --video "$RUNNER_TEMP/sample.mp4" --media-dir "$RUNNER_TEMP/media" > "$RUNNER_TEMP/fixture.log" 2>&1 &
          # Stand-in for the TorBox API (the app is pointed at it by -AETHER_UITEST_TORBOX_URL); loopback only, serves the same sample video.
          nohup node Tools/FixtureTorBoxServer/server.js --port 7778 --video "$RUNNER_TEMP/sample.mp4" > "$RUNNER_TEMP/torbox-fixture.log" 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:7778/ | head -c 200
          LAN_IP=$(ipconfig getifaddr en0 || ipconfig getifaddr en1 || true)
          echo "LAN address: ${LAN_IP:-none}"
          echo "lan_ip=$LAN_IP" >> "$GITHUB_OUTPUT"
          curl -fsS http://127.0.0.1:7777/manifest.json | head -c 200
          curl -fsSI -H "Range: bytes=0-99" http://127.0.0.1:7777/media/sample.mp4 | head -5

      - name: UI tests
        id: ui
        if: steps.fixture.outcome == 'success'
        env:
          UI_TESTS: ${{ inputs.ui_tests }}
        run: |
          set -o pipefail
          # UI_TESTS may list several targets separated by commas (AetherUITests/LayoutUITests,AetherUITests/BrowseUITests).
          ONLY=()
          IFS=',' read -ra TARGETS <<< "${UI_TESTS:-AetherUITests}"
          for target in "${TARGETS[@]}"; do ONLY+=("-only-testing:$target"); done
          TEST_RUNNER_AETHER_FIXTURE_LAN_HOST="${{ steps.fixture.outputs.lan_ip }}" \
          xcodebuild test-without-building \
            -project Aether.xcodeproj -scheme Aether \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            "${ONLY[@]}" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" 2>&1 | tee "$RUNNER_TEMP/ui.log"

      - name: Upload result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-bundles
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Results summary
        if: always()
        run: |
          echo "=== compiler errors ==="
          grep -E "error:" "$RUNNER_TEMP/build.log" | grep -v "^note" | sort -u | head -40 || true
          echo "=== unit tests ==="
          grep -E "Executed [0-9]+ tests?" "$RUNNER_TEMP/unit.log" | tail -2 || true
          grep -E "error: -\[|Test Case .* failed" "$RUNNER_TEMP/unit.log" | sort -u | head -40 || true
          echo "=== UI tests ==="
          grep -E "Executed [0-9]+ tests?" "$RUNNER_TEMP/ui.log" | tail -2 || true
          grep -E "Test Case .* (passed|failed)" "$RUNNER_TEMP/ui.log" | sed -E 's/.*Test Case .-\[AetherUITests\.//' | head -60 || true
          grep -E "error: -\[" "$RUNNER_TEMP/ui.log" | sort -u | head -40 || true
          echo "=== media matrix (what the info sheet showed) ==="
          grep -h "MATRIX-LINE" "$RUNNER_TEMP/ui.log" | sort -u | head -40 || true
          echo "=== accessibility audit notes ==="
          grep -h "A11Y-ISSUE" "$RUNNER_TEMP/ui.log" | sort -u | head -30 || true
          echo "=== fixture server ==="
          tail -5 "$RUNNER_TEMP/fixture.log" || true
          echo "=== TOTALS ==="
          echo "unit: $(grep -E 'Executed [0-9]+ tests?' "$RUNNER_TEMP/unit.log" | tail -1 | sed -E 's/^[[:space:]]*//')"
          echo "ui:   $(grep -E 'Executed [0-9]+ tests?' "$RUNNER_TEMP/ui.log" | tail -1 | sed -E 's/^[[:space:]]*//')"
