name: Aether TV · Test
# Runs on every change to the Android TV code: Kotlin core tests, lint (blocking) and the app's unit / simulated-remote tests.
# It builds no APK: for that use the "Aether TV · Build APK" workflow.
on:
  push:
    branches: ['**']
    paths: ['android-tv/**', '.github/workflows/android-tv-test.yml']
  pull_request:
    paths: ['android-tv/**', '.github/workflows/android-tv-test.yml']
  workflow_dispatch:

concurrency:
  group: android-tv-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android-tv

jobs:
  core:
    name: Core (Kotlin tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the core
        run: ./gradlew :core:test -PcoreOnly=true --console=plain
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-core-test-report
          path: android-tv/core/build/reports/tests/test
          if-no-files-found: ignore

  app:
    name: App (lint and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already carries the Android SDK (ANDROID_HOME); only the licenses are accepted here.
      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint and test
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --console=plain

      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = "app/build/reports/lint-results-debug.xml"
          if not os.path.exists(path):
              print("no lint report"); raise SystemExit
          issues = ET.parse(path).getroot().findall("issue")
          counts = {}
          for i in issues:
              counts[i.get("severity")] = counts.get(i.get("severity"), 0) + 1
          print("lint:", counts)
          for i in issues:
              if i.get("severity") in ("Fatal", "Error"):
                  loc = i.find("location")
                  print(i.get("severity"), i.get("id"), (i.get("message") or "")[:160], loc.get("file", "")[-80:] if loc is not None else "", loc.get("line", "") if loc is not None else "")
          print("--- warnings by kind")
          kinds = {}
          for i in issues:
              if i.get("severity") == "Warning":
                  kinds[i.get("id")] = kinds.get(i.get("id"), 0) + 1
          for k, v in sorted(kinds.items(), key=lambda x: -x[1])[:25]:
              print(f"{v:4d} {k}")
          PY

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-app-reports
          path: |
            android-tv/app/build/reports/lint-results-debug.html
            android-tv/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
