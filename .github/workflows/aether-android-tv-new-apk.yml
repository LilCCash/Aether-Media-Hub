name: Aether Android TV · APK

on:
  push:
    branches: [aether-android-tv-new]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      upload_to_vibeview:
        description: "Upload the APK to VibeView (needs the VIBEVIEW_API_TOKEN secret)"
        type: boolean
        default: false

concurrency:
  group: atv-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Write: the build is published to the rolling release «aether-androidtv-latest», where the app looks for updates.
  contents: write

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      # Signing: with the repository secrets AETHER_KEYSTORE_BASE64 and AETHER_KEYSTORE_PASSWORD (AETHER_KEY_ALIAS and
      # AETHER_KEY_PASSWORD are optional: «aether» and the same password) every APK is signed with the same key, so each build
      # installs over the previous one and the app can update itself. Without them it is signed with a throw-away debug key:
      # it installs, but every build must replace the previous one and is not offered as an update.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "AETHER secrets present: ${{ secrets.AETHER_KEYSTORE_BASE64 != '' }} · ANDROID secrets present: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AETHER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "No release key in the secrets: debug signature"
          fi
      - name: Build
        env:
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:assembleRelease -PaetherVersionCode=${{ github.run_number }}
      - name: Check the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/37.0.0"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|leanback|LEANBACK_LAUNCHER|sdkVersion|native-code" | tee badging.txt
          grep -qE "LEANBACK_LAUNCHER|leanback-launchable-activity" badging.txt || { echo "::error::not a TV launcher app"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          NAME="Aether-AndroidTV-$(grep -o "versionName='[^']*'" badging.txt | cut -d"'" -f2)-${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "### $NAME — $(du -h "$NAME" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          compression-level: 0
          retention-days: 30
      # The app's «Cerca aggiornamenti» reads update.json from this release. Only builds signed with the repository key are
      # published: a build with a throw-away key could not install over the app.
      - name: Publish the update
        if: ${{ env.AETHER_KEYSTORE_FILE != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=aether-androidtv-latest
          cp "$APK_NAME" Aether-AndroidTV.apk
          VC=$(grep -o "versionCode='[0-9]*'" badging.txt | grep -o "[0-9]*")
          VN=$(grep -o "versionName='[^']*'" badging.txt | cut -d"'" -f2)
          NOTES=$(git log -1 --pretty=%s | head -c 300)
          python3 - "$VC" "$VN" "$NOTES" <<'PY'
          import hashlib, json, os, sys, datetime
          apk = "Aether-AndroidTV.apk"
          data = open(apk, "rb").read()
          info = {
              "versionCode": int(sys.argv[1]), "versionName": sys.argv[2], "notes": sys.argv[3],
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/aether-androidtv-latest/{apk}",
              "sha256": hashlib.sha256(data).hexdigest(), "size": len(data),
              "publishedAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(info, open("update.json", "w"))
          print(info)
          PY
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Aether Android TV · ultima build" --notes "Usata da Impostazioni ▸ Informazioni ▸ Cerca aggiornamenti."
          # The APK first, then update.json: the app never sees a description of a file that is not there yet.
          gh release upload "$TAG" Aether-AndroidTV.apk --clobber
          gh release upload "$TAG" update.json --clobber
          gh release edit "$TAG" --notes "Build $VC ($VN): $NOTES"
          echo "### Pubblicata come aggiornamento: build $VC" >> "$GITHUB_STEP_SUMMARY"
      - name: Not published as an update
        if: ${{ env.AETHER_KEYSTORE_FILE == '' }}
        run: echo "::warning::No signing key in the secrets, this build is not offered to the app as an update."
      # Optional: the same VibeView upload as android-tv-vibeview.yml, straight from this build (Run workflow > Upload to VibeView).
      - uses: actions/setup-node@v4
        if: ${{ inputs.upload_to_vibeview }}
        with:
          node-version: '22'
      - name: Upload to VibeView
        if: ${{ inputs.upload_to_vibeview }}
        env:
          VIBEVIEW_API_TOKEN: ${{ secrets.VIBEVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${VIBEVIEW_API_TOKEN:-}" ] || { echo "::error::Missing VIBEVIEW_API_TOKEN (Settings > Secrets and variables > Actions)."; exit 1; }
          unzip -l "$APK_NAME" | grep -q "lib/x86_64/" || { echo "::error::The APK has no x86_64 libraries for the VibeView devices."; exit 1; }
          RESULT=$(npx -y vibeview upload-app "$APK_NAME" --token "$VIBEVIEW_API_TOKEN" --name "Aether TV" --note "aether-android-tv-new ${GITHUB_SHA::7} (run ${{ github.run_number }})" --output json)
          echo "$RESULT"
          { echo "## VibeView upload"; echo "- APK: \`$APK_NAME\`"; echo "- Response: \`$RESULT\`"; } >> "$GITHUB_STEP_SUMMARY"
